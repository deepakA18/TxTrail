[package]
name = "txtrail"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Evidence-first Solana transaction lifecycle debugger"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
base64 = "0.22"
bincode = "1.3"
solana-sdk = "=2.1.7"
httpdate = "1"

[dev-dependencies]
tempfile = "3"
